[project]
name = "connectplus-rag"
version = "0.1.0"
description = "Trusted-knowledge and verification service for CONNECT Plus"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "trafilatura>=1.8",
    "langdetect>=1.0.9",
    "pypdf>=4.0",
    "transformers>=4.40",
    "sentence-transformers>=3.0",
    "psycopg2-binary>=2.9",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.9",
]

[tool.setuptools.packages.find]
# Explicit on purpose: setuptools' automatic package discovery treats every
# top-level folder as a candidate "package". The extraction script's own
# output folder (fixture_candidates/) sitting next to rag/ was enough to
# make a real install fail with "Multiple top-level packages discovered".
# This pins installation to just the actual package, regardless of what
# other folders (fixture output, IDE config, etc.) end up in the repo root.
include = ["rag*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
