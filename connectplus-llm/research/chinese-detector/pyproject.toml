[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chinese-detector"
version = "0.1.0"
description = "Trained Chinese-language detector for CONNECT Plus's query stage."
requires-python = ">=3.10"
dependencies = [
    "joblib>=1.3",
    "scikit-learn>=1.3",
]

[tool.setuptools]
packages = ["chinese_detector"]
